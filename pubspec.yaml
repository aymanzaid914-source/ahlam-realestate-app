name: ahlam_real_estate
description: تطبيق أحلام الشرق للتطوير العقاري - نظام حجز وإدارة عقارات احترافي

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: 1.5.0

  # State Management
  provider: 6.1.5+1

  # Local Storage
  shared_preferences: 2.5.3

  # Image
  cached_network_image: 3.4.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: 0.7.0
  shimmer: 3.0.0
  carousel_slider: 5.0.0
  photo_view: 0.15.0
  flutter_rating_bar: 4.0.1
  smooth_page_indicator: 1.2.0+3

  # Navigation & Routing
  go_router: 14.6.3

  # Localization & RTL
  intl: 0.20.2

  # Utils
  url_launcher: 6.3.1
  share_plus: 10.1.4
  connectivity_plus: 6.1.4

  # Fonts
  google_fonts: 6.2.1

  # Icons
  font_awesome_flutter: 10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
